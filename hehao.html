<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>求和好</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    font-family: "Microsoft YaHei", sans-serif;
    gap: 40px;
    overflow: hidden;
  }
  h1 {
    color: #c0392b;
    font-size: 42px;
    text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.6);
  }
  p { color: #8e44ad; font-size: 22px; }
  .buttons {
    display: flex;
    align-items: center;
    gap: 40px;
    min-height: 120px;
  }
  button {
    border: none;
    border-radius: 12px;
    padding: 16px 36px;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
  }
  #yes {
    background: linear-gradient(135deg, #ff6b81, #ff4757);
    color: #fff;
  }
  #yes:hover { transform: scale(1.05); }
  #no {
    background: #b2bec3;
    color: #fff;
    font-size: 14px;
    padding: 10px 20px;
  }
  #msg {
    font-size: 20px;
    color: #d63031;
    font-weight: bold;
    min-height: 30px;
  }
</style>
</head>
<body>
  <h1>我们和好吧 🥺</h1>
  <p>这是我精心准备的道歉，请原谅我好不好？</p>
  <div class="buttons">
    <button id="yes" onclick="sayYes()">和好 ❤️</button>
    <button id="no" onclick="sayNo()">狠心拒绝</button>
  </div>
  <div id="msg"></div>

<script>
  let scale = 1;
  const yesBtn = document.getElementById('yes');
  const noBtn = document.getElementById('no');
  const msg = document.getElementById('msg');

  function sayYes() {
    document.querySelector('h1').textContent = '太好了！我超级开心！🎉';
    document.querySelector('p').textContent = '谢谢你原谅我，我会好好珍惜的～';
    msg.textContent = '';
    noBtn.style.display = 'none';
    yesBtn.style.transform = 'scale(1.2)';
  }

  function sayNo() {
    msg.textContent = '❌ 无效选择，请重新选择！';
    scale += 0.3;
    yesBtn.style.fontSize = 20 * scale + 'px';
    yesBtn.style.padding = 16 * scale + 'px ' + 36 * scale + 'px';
    noBtn.style.fontSize = Math.max(14 - (scale - 1) * 4, 6) + 'px';
    noBtn.style.padding = Math.max(10 - (scale - 1) * 3, 3) + 'px ' + Math.max(20 - (scale - 1) * 6, 6) + 'px';
  }
</script>
</body>
</html>
